// Applied last by the TuinDOOM RT launcher so mods cannot silently replace
// the built-in runtime controls.
bind n "rt_autosun_next"
bind f "toggle rt_flsh"

// Remove the non-working manual sun-intensity bindings, including bindings
// retained in an existing user configuration from an earlier release.
unbind ","
unbind "."
unbind "["
unbind "]"
